<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102033"><title>FuelPulse Admin</title><style>body{margin:0;font:14px DM Sans,system-ui,sans-serif;color:#102033;background:linear-gradient(135deg,#eef9f5,#eaf0ff);min-height:100vh}*{box-sizing:border-box}.wrap{width:min(1050px,calc(100% - 32px));margin:0 auto;padding:32px 0}.card{background:rgba(255,255,255,.7);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(16,32,51,.12);margin-bottom:18px}.brand{font:700 24px system-ui;margin-bottom:26px}.muted{color:#718096}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin:12px 0}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid rgba(16,32,51,.12);border-radius:14px;background:rgba(255,255,255,.75)}button{padding:13px 17px;border:0;border-radius:14px;background:linear-gradient(135deg,#102033,#08784f);color:#fff;font-weight:800;cursor:pointer}.ghost{background:rgba(16,32,51,.08);color:#102033}.cred{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.55);margin:9px 0}.cred b{font-family:monospace;font-size:16px}.notice{padding:12px;border-radius:12px;background:rgba(16,163,107,.1);margin-bottom:14px}.error{background:rgba(210,60,60,.1);color:#9b2525}.hidden{display:none}h1{font:700 38px system-ui;margin:4px 0 8px}</style></head><body><main class="wrap"><div class="brand">⛽ FuelPulse <span class="muted">/ Private Admin</span></div><section id="login" class="card"><h1>Owner provisioning</h1><p class="muted">Sign in with an existing Owner account to provision separate customer organizations.</p><form id="lf"><label>Station ID<input name="station" required placeholder="your-station"></label><label>Owner code<input name="code" required placeholder="owner01"></label><label>Password<input name="password" type="password" required></label><button>Enter Admin</button></form><p id="msg"></p></section><section id="app" class="hidden"><div class="card"><h1>Create a new Owner</h1><p class="muted">Each Owner gets an isolated organization, Station ID, login code and a one-time generated password.</p><form id="of"><label>Business / organization name<input name="organizationName" required placeholder="Example Fuel Station"></label><label>Station ID<input name="stationId" required pattern="[a-z0-9][a-z0-9-]{2,62}" placeholder="example-fuel"></label><label>Owner name<input name="ownerName" required placeholder="Owner name"></label><button>Generate Owner credentials</button></form></div><div id="result" class="card hidden"></div><div class="card"><h2>Organizations</h2><div id="orgs" class="muted">Loading…</div><button class="ghost" id="logout">Sign out</button></div></section></main><script type="module" src="./admin.js"></script></body></html>
